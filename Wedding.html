<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Guest Leaderboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Wedding guest leaderboard for live score updates and celebration details." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="Photos/Logo.png" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    try {
      document.documentElement.setAttribute('data-theme', 'light');
      localStorage.setItem('simulate-it-theme', 'light');
    } catch (e) {}
  </script>
  <style>
    :root {
      --bg: #fffdfb;
      --bg-soft: #faf8f5;
      --surface: #ffffff;
      --surface-soft: #fffaf8;
      --primary: #b88a5c;
      --primary-strong: #9a6b3c;
      --accent: #e9d5d2;
      --accent-strong: #d8b7b0;
      --text: #2d2a2a;
      --muted: #685f5d;
      --border: rgba(70, 54, 46, 0.12);
      --shadow: 0 12px 30px rgba(80, 62, 49, 0.08);
      --container-width: 1280px;
      --base-font-size: 17px;
      --base-line: 1.55;
      --header-h: 4rem;
      --gold: #c8a66c;
      --silver: #9aa1a4;
      --bronze: #b77c58;
      --prize-bg: linear-gradient(180deg, #fffdfb, #faf8f5);
      color-scheme: light;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Lora", Georgia, serif;
      font-size: var(--base-font-size);
      line-height: var(--base-line);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 0 1.1rem;
    }

    a { color: var(--primary-strong); text-decoration: none; }
    a:hover { text-decoration: underline; }

    h1, h2, h3 {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-weight: 600;
      color: var(--text);
      line-height: 1.1;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      width: 100%;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 2px 12px rgba(70, 54, 46, 0.04);
    }

    .header-inner {
      width: min(var(--container-width), calc(100% - 2rem));
      margin: 0 auto;
      min-height: var(--header-h);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.7rem 0;
    }

    .brand-pill {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(1.2rem, 2vw, 1.8rem);
      font-weight: 600;
      letter-spacing: 0.04em;
      color: var(--primary-strong);
    }

    .header-end {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-left: auto;
    }

    .icon-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 44px;
      min-height: 44px;
      padding: 0 0.75rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: var(--surface);
      color: var(--text);
      font-size: 1.1rem;
      cursor: pointer;
      line-height: 1;
      box-shadow: 0 4px 12px rgba(70, 54, 46, 0.04);
    }

    .icon-btn:hover {
      background: var(--bg-soft);
      border-color: rgba(184, 138, 92, 0.28);
    }

    .page-wrap {
      width: min(var(--container-width), calc(100% - 2rem));
      margin: 1rem auto 0;
      flex: 1;
    }

    .event-header {
      background: linear-gradient(180deg, #fff, #fffaf8);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 1.4rem 1.5rem 1.1rem;
      margin-bottom: 1rem;
      text-align: center;
      box-shadow: var(--shadow);
    }

    .event-header .brand-line {
      color: var(--primary-strong);
      font-size: 0.88rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 700;
      margin-bottom: 0.35rem;
    }

    .event-header h1 {
      font-size: clamp(2rem, 4vw, 3rem);
      letter-spacing: 0.02em;
      margin-bottom: 0.35rem;
    }

    .event-header .hole-meta {
      color: var(--muted);
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 600;
    }

    .event-header .hole-length {
      font-size: 0.98rem;
      color: var(--muted);
      margin-top: 0.25rem;
      font-weight: 500;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
      width: 100%;
    }

    @media (min-width: 900px) {
      .container {
        grid-template-columns: minmax(320px, 0.95fr) minmax(360px, 1.05fr);
      }
      .leaderboard-panel { grid-column: 2; grid-row: 1 / span 2; }
      .flyover-panel { grid-row: 1; }
      .side-panel { grid-row: 2; }
    }

    .flyover-panel, .side-panel, .leaderboard-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow);
    }

    .flyover-panel { display: flex; flex-direction: column; }

    .flyover-wrap {
      position: relative;
      background: linear-gradient(135deg, #1f1d1d, #4e3a35);
      aspect-ratio: 16 / 9;
      min-height: 200px;
    }

    .flyover-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #1d1716;
    }

    .flyover-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 0.6rem 1rem;
      background: linear-gradient(transparent, rgba(25, 17, 14, 0.72));
      color: #fff;
      font-size: 0.86rem;
      font-weight: 600;
      letter-spacing: 0.04em;
    }

    .flyover-fallback {
      display: none;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: rgba(255, 255, 255, 0.82);
      font-size: 0.95rem;
      text-align: center;
      padding: 1rem;
      background: rgba(43, 32, 29, 0.7);
    }

    .flyover-wrap.no-video .flyover-fallback { display: flex; }
    .flyover-wrap.no-video video { display: none; }

    .side-panel {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    #rules-heading {
      text-align: center;
      font-size: clamp(1.3rem, 2vw, 1.8rem);
      color: var(--text);
      margin-bottom: 0.3rem;
    }

    .rules {
      color: var(--muted);
      text-align: center;
      font-size: 0.98rem;
    }

    .rules p {
      margin: 0.2rem 0;
    }

    .prize-box {
      background: var(--prize-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .prize-box h3 {
      text-align: center;
      font-size: 1.5rem;
      margin-bottom: 0.45rem;
    }

    #prize-list p {
      margin: 0.35rem 0;
      font-size: 0.99rem;
      text-align: center;
      color: var(--text);
    }

    #prize-list p.empty,
    .rules .empty,
    .lb-empty {
      color: var(--muted);
      font-style: italic;
    }

    .leaderboard-panel {
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
    }

    .leaderboard-title {
      font-size: clamp(1.6rem, 3vw, 2.3rem);
      text-align: center;
      margin-bottom: 0.7rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.45rem;
      flex-shrink: 0;
    }

    .leaderboard-stack {
      display: flex;
      flex-direction: column;
      width: 100%;
      flex: 1;
    }

    .lb-row {
      display: grid;
      grid-template-columns: 3.3rem 1fr auto;
      gap: 0.5rem;
      align-items: center;
      padding: 0.7rem 0.4rem;
      border-bottom: 1px solid var(--border);
      font-size: 1.05rem;
      background: transparent;
    }

    .lb-row:last-child { border-bottom: none; }

    .lb-rank {
      font-weight: 700;
      color: var(--primary-strong);
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.2em;
    }

    .lb-name {
      font-weight: 600;
      color: var(--text);
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .lb-distance {
      text-align: right;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--text);
    }

    .lb-row.gold .lb-rank,
    .lb-row.gold .lb-name,
    .lb-row.gold .lb-distance { color: var(--gold); }
    .lb-row.silver .lb-rank,
    .lb-row.silver .lb-name,
    .lb-row.silver .lb-distance { color: var(--silver); }
    .lb-row.bronze .lb-rank,
    .lb-row.bronze .lb-name,
    .lb-row.bronze .lb-distance { color: var(--bronze); }

    .lb-row.leader {
      padding-top: 0.15rem;
      padding-bottom: 0.8rem;
    }

    .lb-row.leader .lb-name { font-size: 1.14em; }
    .lb-row.leader .lb-distance { font-size: 1.08em; }

    .lb-row.moved { animation: slideUp 0.5s ease forwards; }
    .lb-row.new-leader { animation: glow 1.4s ease; }

    @keyframes slideUp {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    @keyframes glow {
      0% { background: transparent; box-shadow: none; }
      20% { background: rgba(200, 166, 108, 0.16); box-shadow: 0 0 22px rgba(200, 166, 108, 0.28); }
      50% { background: rgba(200, 166, 108, 0.1); box-shadow: 0 0 14px rgba(200, 166, 108, 0.2); }
      100% { background: transparent; box-shadow: none; }
    }

    .live-note {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 1rem;
      font-style: italic;
    }

    .fetch-error {
      display: none;
      margin-top: 0.7rem;
      padding: 0.75rem 1rem;
      border-radius: 12px;
      background: #fdf0f0;
      color: #8b3c3c;
      border: 1px solid rgba(139, 60, 60, 0.18);
      font-size: 0.92rem;
      text-align: center;
    }

    .fetch-error.visible { display: block; }

    .tv-exit-fab {
      position: fixed;
      bottom: 0.85rem;
      right: 0.85rem;
      z-index: 9999;
      padding: 0.6rem 1rem;
      border-radius: 999px;
      border: none;
      background: rgba(46, 36, 31, 0.84);
      color: #fff;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
    }

    .tv-exit-fab:hover { background: rgba(46, 36, 31, 0.94); }

    body.tv-mode .site-header { display: none; }
    body.tv-mode .live-note { display: none; }
    body.tv-mode .fetch-error:not(.visible) { display: none; }

    html.tv-mode, html.tv-mode body {
      height: 100%;
      overflow: hidden;
    }

    html.tv-mode body {
      min-height: 0;
      padding: 0;
      display: block;
    }

    html:fullscreen, html:-webkit-full-screen {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--bg);
    }

    html:fullscreen body, html:-webkit-full-screen body {
      height: 100%;
      overflow: hidden;
    }

    body.tv-mode .page-wrap {
      margin: 0;
      width: 100%;
      max-width: none;
      height: 100dvh;
      height: 100vh;
      padding: 0.45rem 0.6rem 0.5rem;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-sizing: border-box;
    }

    body.tv-mode .event-header {
      flex: 0 0 auto;
      margin-bottom: 0.4rem;
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
    }

    body.tv-mode .event-header .brand-line {
      font-size: clamp(0.62rem, 1.1vh, 0.78rem);
      margin-bottom: 0.12rem;
    }

    body.tv-mode .event-header h1 {
      font-size: clamp(0.95rem, 2.8vh, 1.65rem);
      line-height: 1.12;
      margin-bottom: 0.12rem;
    }

    body.tv-mode .event-header .hole-meta {
      font-size: clamp(0.78rem, 1.9vh, 1.05rem);
    }

    body.tv-mode .event-header .hole-length {
      font-size: clamp(0.7rem, 1.5vh, 0.9rem);
      margin-top: 0.08rem;
    }

    body.tv-mode .container {
      flex: 1 1 auto;
      min-height: 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr);
      grid-template-rows: minmax(0, 1.15fr) minmax(0, 0.85fr);
      gap: 0.45rem;
      align-items: stretch;
      width: 100%;
    }

    body.tv-mode .flyover-panel,
    body.tv-mode .side-panel,
    body.tv-mode .leaderboard-panel {
      min-height: 0;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
    }

    body.tv-mode .flyover-panel { grid-column: 1; grid-row: 1; overflow: hidden; }
    body.tv-mode .side-panel { grid-column: 1; grid-row: 2; padding: 0.55rem 0.65rem; gap: 0.35rem; overflow: hidden; }
    body.tv-mode .leaderboard-panel { grid-column: 2; grid-row: 1 / span 2; padding: 0.55rem 0.65rem; overflow: hidden; height: 100%; }

    body.tv-mode .flyover-wrap {
      flex: 1 1 auto;
      min-height: 0;
      width: 100%;
      aspect-ratio: unset;
    }

    body.tv-mode .flyover-label { font-size: clamp(0.63rem, 1.5vh, 0.8rem); padding: 0.35rem 0.5rem; }
    body.tv-mode #rules-heading { font-size: clamp(0.8rem, 2vh, 1rem); margin-bottom: 0.15rem; }
    body.tv-mode .rules { font-size: clamp(0.7rem, 1.7vh, 0.88rem); line-height: 1.35; }
    body.tv-mode .rules p { margin: 0.1rem 0; }
    body.tv-mode .prize-box { padding: 0.45rem 0.55rem; flex: 1 1 auto; min-height: 0; overflow: hidden; }
    body.tv-mode .prize-box h3 { font-size: clamp(0.76rem, 1.8vh, 0.9rem); margin-bottom: 0.2rem; }
    body.tv-mode #prize-list p { font-size: clamp(0.7rem, 1.7vh, 0.85rem); margin: 0.15rem 0; }

    body.tv-mode .leaderboard-title {
      font-size: clamp(0.9rem, 2.2vh, 1.2rem);
      margin-bottom: 0.35rem;
      padding-bottom: 0.3rem;
      flex-shrink: 0;
    }

    body.tv-mode .leaderboard-stack {
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    body.tv-mode .lb-row {
      flex: 0 0 auto;
      padding: clamp(0.2rem, 0.9vh, 0.45rem) 0.35rem;
      font-size: clamp(0.75rem, 2vh, 1.1rem);
      gap: 0.35rem;
      grid-template-columns: 2.5rem 1fr auto;
    }

    body.tv-mode .lb-row.leader .lb-name { font-size: 1.05em; }
    body.tv-mode .lb-row.leader .lb-distance { font-size: 1.05em; }

    @media (prefers-reduced-motion: reduce) {
      .lb-row.moved, .lb-row.new-leader { animation: none; }
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand-pill">Guest leaderboard</div>
      <div class="header-end">
        <button type="button" class="icon-btn" data-tv-toggle aria-pressed="false" aria-label="TV fullscreen mode" title="TV mode">📺</button>
      </div>
    </div>
  </header>

  <div class="page-wrap">
    <header class="event-header">
      <p class="brand-line">With love</p>
      <h1 id="competition-name">Loading event…</h1>
      <p class="hole-meta" id="hole-name"></p>
      <p class="hole-length" id="hole-length" hidden></p>
    </header>

    <div class="container">
      <section class="flyover-panel" aria-label="Hole flyover">
        <div class="flyover-wrap" id="flyover-wrap">
          <video id="flyover-video" muted loop playsinline autoplay aria-label="Hole flyover video"></video>
          <p class="flyover-fallback" id="flyover-fallback">Flyover video unavailable</p>
          <p class="flyover-label" id="flyover-label">Hole flyover</p>
        </div>
      </section>

      <aside class="side-panel">
        <div>
          <h2 id="rules-heading">Nearest To The Pin</h2>
          <div class="rules" id="rules-list">
            <p class="empty">Loading rules…</p>
          </div>
        </div>
        <div class="prize-box">
          <h3>Prizes</h3>
          <div id="prize-list">
            <p class="empty">Loading prizes…</p>
          </div>
        </div>
      </aside>

      <section class="leaderboard-panel">
        <h2 class="leaderboard-title">Guest leaderboard</h2>
        <div class="leaderboard-stack" id="leaderboard-body" role="list" aria-label="Leaderboard rankings">
          <p class="lb-empty">Waiting for first entry…</p>
        </div>
      </section>
    </div>

    <p class="live-note">Scores update throughout the celebration.</p>
    <p class="fetch-error" id="fetch-error" role="alert">Unable to load live data. Check your connection and try again.</p>
  </div>

  <button type="button" class="tv-exit-fab" data-tv-exit hidden aria-label="Exit TV mode">Exit TV mode</button>

  <script>
    (function () {
      var STORAGE_KEY = "simulate-it-theme";
      var root = document.documentElement;

      function setTvMode(on) {
        document.body.classList.toggle("tv-mode", on);
        root.classList.toggle("tv-mode", on);

        document.querySelectorAll("[data-tv-toggle]").forEach(function (btn) {
          btn.setAttribute("aria-pressed", on ? "true" : "false");
          btn.setAttribute("aria-label", on ? "Exit TV mode" : "TV fullscreen mode");
          btn.setAttribute("title", on ? "Exit TV mode" : "TV mode");
        });

        document.querySelectorAll("[data-tv-exit]").forEach(function (btn) {
          btn.hidden = !on;
        });

        window.dispatchEvent(new CustomEvent("tv-mode-change", { detail: { active: on } }));
      }

      function exitTvMode() {
        setTvMode(false);
        if (document.fullscreenElement) {
          if (document.exitFullscreen) document.exitFullscreen().catch(function () {});
          else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
      }

      function initTvMode() {
        var btn = document.querySelector("[data-tv-toggle]");
        if (!btn) return;

        btn.addEventListener("click", function () {
          var turningOn = !document.body.classList.contains("tv-mode");
          if (turningOn) {
            setTvMode(true);
            var el = document.documentElement;
            if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
            else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
          } else {
            exitTvMode();
          }
        });

        document.querySelectorAll("[data-tv-exit]").forEach(function (exitBtn) {
          exitBtn.addEventListener("click", exitTvMode);
        });

        function onFullscreenEnd() {
          if (!document.fullscreenElement && !document.webkitFullscreenElement) setTvMode(false);
        }

        document.addEventListener("fullscreenchange", onFullscreenEnd);
        document.addEventListener("webkitfullscreenchange", onFullscreenEnd);
      }

      function fitTvLayoutNow() {
        var pageWrap = document.querySelector('.page-wrap');
        if (!document.body.classList.contains('tv-mode') || !pageWrap) return;

        var panel = document.querySelector('.leaderboard-panel');
        var stack = document.getElementById('leaderboard-body');
        var rows = stack ? stack.querySelectorAll('.lb-row') : [];

        if (panel && rows.length) {
          var title = panel.querySelector('.leaderboard-title');
          var titleH = title ? title.offsetHeight : 0;
          var available = panel.clientHeight - titleH - 8;
          var rowH = Math.floor(available / rows.length);
          rowH = Math.max(26, Math.min(rowH, 52));
          var fontSize = Math.min(Math.max(rowH * 0.42, 11), 20);

          rows.forEach(function (row) {
            row.style.padding = Math.max(2, rowH * 0.12) + 'px 0.35rem';
            row.style.fontSize = fontSize + 'px';

            var isLeader = row.classList.contains('leader');
            var name = row.querySelector('.lb-name');
            var dist = row.querySelector('.lb-distance');
            if (name) name.style.fontSize = isLeader ? (fontSize * 1.08) + 'px' : fontSize + 'px';
            if (dist) dist.style.fontSize = isLeader ? (fontSize * 1.05) + 'px' : fontSize + 'px';
          });
        }

        requestAnimationFrame(function () {
          var vh = window.innerHeight;
          var vw = window.innerWidth;
          var sh = pageWrap.scrollHeight;
          var sw = pageWrap.scrollWidth;
          var scale = Math.min(1, (vh - 4) / sh, (vw - 4) / sw);
          if (scale < 0.98) {
            pageWrap.style.transform = 'scale(' + scale + ')';
            pageWrap.style.transformOrigin = 'top center';
          } else {
            pageWrap.style.transform = '';
          }
        });
      }

      function debounce(fn, delay) {
        var timer;
        return function () {
          clearTimeout(timer);
          timer = setTimeout(fn, delay);
        };
      }

      var fitTvLayout = debounce(fitTvLayoutNow, 150);

      function resetTvLayout() {
        var pageWrap = document.querySelector('.page-wrap');
        if (pageWrap) pageWrap.style.transform = '';
        document.querySelectorAll('.lb-row').forEach(function (row) {
          row.style.fontSize = '';
          row.style.padding = '';
          var name = row.querySelector('.lb-name');
          var dist = row.querySelector('.lb-distance');
          if (name) name.style.fontSize = '';
          if (dist) dist.style.fontSize = '';
        });
      }

      window.addEventListener('tv-mode-change', function (e) {
        if (e.detail.active) {
          setTimeout(fitTvLayoutNow, 60);
          setTimeout(fitTvLayoutNow, 250);
        } else {
          resetTvLayout();
        }
      });

      window.addEventListener('resize', fitTvLayout);
      document.addEventListener('fullscreenchange', function () { setTimeout(fitTvLayout, 150); });
      window.addEventListener('load', fitTvLayoutNow);

      try {
        localStorage.setItem(STORAGE_KEY, 'light');
      } catch (e) {}

      initTvMode();
    })();

    (function () {
      const API_URL = "https://script.google.com/macros/s/AKfycbxdvuGY5SikEjbv_L4jBMmg3AZcWw2BExwOd76EAutpXxOpnCBH0dkJReNZmBbhFqD1/exec";
      const FLYOVER_BASE = "Photos/Flyover/";
      const MEDALS = ["🥇", "🥈", "🥉"];

      let previousOrder = [];
      let previousLeader = null;
      let lastFlyoverKey = "";
      let lastLeaderboardSig = "";
      let lastRulesSig = "";
      let lastPrizesSig = "";
      let lastEventSig = "";
      let lastRowCount = 0;
      const rowCache = new Map();

      const els = {
        competition: document.getElementById("competition-name"),
        holeName: document.getElementById("hole-name"),
        holeLength: document.getElementById("hole-length"),
        rulesHeading: document.getElementById("rules-heading"),
        rulesList: document.getElementById("rules-list"),
        prizeList: document.getElementById("prize-list"),
        flyoverVideo: document.getElementById("flyover-video"),
        flyoverWrap: document.getElementById("flyover-wrap"),
        flyoverLabel: document.getElementById("flyover-label"),
        fetchError: document.getElementById("fetch-error")
      };

      function escapeHtml(text) {
        const div = document.createElement("div");
        div.textContent = text == null ? "" : String(text);
        return div.innerHTML;
      }

      function flyoverPath(key) {
        if (!key || !String(key).trim()) return "";
        return FLYOVER_BASE + encodeURIComponent(String(key).trim()) + ".mp4";
      }

      function renderRules(rules) {
        const items = (rules || []).map(r => String(r).trim()).filter(Boolean);
        const sig = JSON.stringify(items);
        if (sig === lastRulesSig) return;
        lastRulesSig = sig;

        if (!items.length) {
          els.rulesHeading.textContent = "Nearest To The Pin";
          els.rulesList.innerHTML = '<p class="empty">Rules will appear here</p>';
          return;
        }

        els.rulesHeading.textContent = items[0];
        els.rulesList.innerHTML = items.length === 1 ? "" : items.slice(1).map(line => "<p>" + escapeHtml(line) + "</p>").join("");
      }

      function renderEvent(data) {
        const eventSig = JSON.stringify({
          competitionName: data.competitionName || "Live Event",
          holeName: data.holeName || "",
          holeLength: data.holeLength || ""
        });

        if (eventSig !== lastEventSig) {
          lastEventSig = eventSig;
          els.competition.textContent = data.competitionName || "Live Event";
          els.holeName.textContent = data.holeName ? data.holeName : "";
          els.holeName.hidden = !data.holeName;

          if (data.holeLength) {
            els.holeLength.textContent = "Hole length: " + data.holeLength;
            els.holeLength.hidden = false;
          } else {
            els.holeLength.hidden = true;
          }
        }

        renderRules(data.rules);
        renderPrizes(data.prizes || []);
        renderFlyover(data.flyover, data.holeName);
      }

      function renderPrizes(prizes) {
        const filtered = prizes.filter(p =>
          (p.place && String(p.place).trim()) || (p.prize && String(p.prize).trim())
        );
        const sig = JSON.stringify(filtered);
        if (sig === lastPrizesSig) return;
        lastPrizesSig = sig;

        if (!filtered.length) {
          els.prizeList.innerHTML = '<p class="empty">Prizes to be announced</p>';
          return;
        }

        els.prizeList.innerHTML = filtered.map((p, i) => {
          const medal = i < 3 ? MEDALS[i] + " " : "";
          const place = p.place ? escapeHtml(p.place) : "Prize " + (i + 1);
          const prize = p.prize ? escapeHtml(p.prize) : "";
          return "<p>" + medal + place + (prize ? ": " + prize : "") + "</p>";
        }).join("");
      }

      function renderFlyover(flyoverKey, holeLabel) {
        const key = flyoverKey ? String(flyoverKey).trim() : "";
        els.flyoverLabel.textContent = holeLabel ? "Flyover — " + holeLabel : (key ? "Hole flyover" : "Flyover");

        if (!key) {
          els.flyoverWrap.classList.add("no-video");
          els.flyoverVideo.removeAttribute("src");
          lastFlyoverKey = "";
          return;
        }
        if (key === lastFlyoverKey) return;
        lastFlyoverKey = key;

        const src = flyoverPath(key);
        els.flyoverWrap.classList.remove("no-video");
        els.flyoverVideo.src = src;
        els.flyoverVideo.load();
        els.flyoverVideo.play().catch(() => {});
        els.flyoverVideo.onerror = () => els.flyoverWrap.classList.add("no-video");
        els.flyoverVideo.onloadeddata = () => els.flyoverWrap.classList.remove("no-video");
      }

      function leaderboardSignature(sorted) {
        return JSON.stringify(sorted.map(p => ({ name: p.name, bestDistance: p.bestDistance })));
      }

      function applyRowClasses(row, index, leaderChanged, playerName, prevOrder) {
        row.className = "lb-row";
        if (index === 0) {
          row.classList.add("gold", "leader");
          if (leaderChanged) row.classList.add("new-leader");
        } else if (index === 1) {
          row.classList.add("silver");
        } else if (index === 2) {
          row.classList.add("bronze");
        }

        if (prevOrder.includes(playerName)) {
          const oldIndex = prevOrder.indexOf(playerName);
          if (oldIndex !== index) row.classList.add("moved");
        }
      }

      function renderLeaderboard(rows) {
        const stack = document.getElementById("leaderboard-body");
        const sorted = (rows || []).slice().sort((a, b) => a.bestDistance - b.bestDistance).slice(0, 10);
        const sig = leaderboardSignature(sorted);
        if (sig === lastLeaderboardSig) return;

        const newOrder = sorted.map(p => p.name);
        const currentLeader = sorted.length ? sorted[0].name : null;
        const leaderChanged = currentLeader && previousLeader && currentLeader !== previousLeader;
        const rowCountChanged = sorted.length !== lastRowCount;

        if (!sorted.length) {
          if (!stack.querySelector(".lb-empty")) {
            stack.innerHTML = '<p class="lb-empty">Waiting for first entry…</p>';
            rowCache.clear();
          }
          previousOrder = [];
          previousLeader = null;
          lastLeaderboardSig = sig;
          lastRowCount = 0;
          return;
        }

        const emptyEl = stack.querySelector(".lb-empty");
        if (emptyEl) {
          stack.innerHTML = "";
          rowCache.clear();
        }

        const usedNames = new Set();

        sorted.forEach((player, index) => {
          let row = rowCache.get(player.name);
          if (!row) {
            row = document.createElement("div");
            row.setAttribute("role", "listitem");
            row.innerHTML =
              '<span class="lb-rank"></span>' +
              '<span class="lb-name"></span>' +
              '<span class="lb-distance"></span>';
            rowCache.set(player.name, row);
          }
          usedNames.add(player.name);

          applyRowClasses(row, index, leaderChanged, player.name, previousOrder);
          row.querySelector(".lb-rank").textContent = index < 3 ? MEDALS[index] : String(index + 1);
          row.querySelector(".lb-name").textContent = player.name;
          row.querySelector(".lb-distance").textContent = Number(player.bestDistance).toFixed(2);

          stack.appendChild(row);
        });

        rowCache.forEach((row, name) => {
          if (!usedNames.has(name)) {
            row.remove();
            rowCache.delete(name);
          }
        });

        previousOrder = newOrder;
        previousLeader = currentLeader;
        lastLeaderboardSig = sig;
        lastRowCount = sorted.length;

        if (document.body.classList.contains("tv-mode") && rowCountChanged) {
          window.dispatchEvent(new CustomEvent("tv-mode-change", { detail: { active: true } }));
        }
      }

      async function fetchEventData() {
        try {
          const response = await fetch(API_URL);
          if (!response.ok) throw new Error("HTTP " + response.status);
          const data = await response.json();

          renderEvent(data);
          renderLeaderboard(data.leaderboard);
          els.fetchError.classList.remove("visible");
        } catch (error) {
          console.error("Leaderboard fetch failed", error);
          els.fetchError.classList.add("visible");
        }
      }

      fetchEventData();
      setInterval(fetchEventData, 3000);
    })();
  </script>
</body>
</html>
